apiVersion: v1
kind: Service
metadata:
  name: jarvis-core-service
  namespace: jarvis-system
  labels:
    app: jarvis-core
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: jarvis-core
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-config
  namespace: jarvis-system
data:
  NODE_ENV: "production"
  PORT: "3000"
  RATE_LIMIT_MAX: "150"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jarvis-ingress
  namespace: jarvis-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "jarvis-core-service"
spec:
  tls:
    - hosts:
        - jarvis.avengers-hq.io
      secretName: jarvis-tls-cert
  rules:
    - host: jarvis.avengers-hq.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jarvis-core-service
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jarvis-core-hpa
  namespace: jarvis-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jarvis-core-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
